# Durable (recommended for tick capture)
appendonly yes
appendfsync everysec

# Hourly snapshot after at least one change (extra recovery copy alongside AOF).
# Frequent full snapshots cause unnecessary disk churn on Docker's virtual disk.
save 3600 1
dir /data

# Refuse new writes rather than evicting unarchived market data. Retention must
# keep the dataset below this threshold; snapshots/AOF also need RAM headroom.
maxmemory 4gb
maxmemory-policy noeviction
